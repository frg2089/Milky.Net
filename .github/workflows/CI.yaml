name: Build and Pack

on:
  push:
    branches:
      - master
      - develop
      - update/milky-types
    tags:
      - v*
    paths:
      - .github/workflows/CI.yaml
      - .config/dotnet-tools.json
      - global.json
      - nuget.config
      - Milky.Net.slnx
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - 'generator/**/*'
      - 'src/**/*'
      - MilkyVersion

  pull_request:
    branches:
      - master
      - develop
    paths:
      - .github/workflows/CI.yaml
      - .config/dotnet-tools.json
      - global.json
      - nuget.config
      - Milky.Net.slnx
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - 'generator/**/*'
      - 'src/**/*'
      - MilkyVersion

jobs:
  build:
    name: 构建
    runs-on: windows-latest
    steps:
      - name: 签出仓库
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: 配置 .Net 环境
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
          config-file: ./nuget.config
          cache-dependency-path: '**/packages.lock.json'

      - name: 还原
        run: dotnet restore --graph --artifacts-path artifacts

      - name: 初始化
        shell: pwsh
        run: ./scripts/Init-Project.ps1

      - name: 生成
        run: dotnet build --graph --artifacts-path artifacts --configuration Release --no-restore

      - name: 打包
        run: dotnet pack --graph --artifacts-path artifacts --configuration Release --no-restore --no-build --include-symbols

      - name: 收集 Nuget 包
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*
          retention-days: 3

  publish:
    needs: build
    name: 发布
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      discussions: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: 签出仓库
        uses: actions/checkout@v7
        with:
          sparse-checkout: '.'

      - name: 配置 .Net 环境
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          config-file: ./nuget.config
          cache: false

      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送 Nuget 包
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source "https://www.nuget.org/api/v2/package" --skip-duplicate
